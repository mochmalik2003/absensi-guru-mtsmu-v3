<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Absensi Guru Online</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#0b132b] via-slate-900 to-blue-950 flex items-center justify-center p-4 text-slate-800">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200/70">

    <!-- Header Kop & Logo Sekolah Dinamis -->
    <div class="bg-[#0b132b] px-6 pt-8 pb-7 text-center text-white relative">
      <div class="w-20 h-20 mx-auto rounded-2xl bg-white p-2 flex items-center justify-center shadow-lg mb-3.5 overflow-hidden">
        <img id="login-logo" src="" alt="Logo Sekolah" class="w-full h-full object-contain hidden" />
        <svg id="login-default-logo" class="w-10 h-10 text-emerald-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342" />
        </svg>
      </div>

      <p id="login-app-title" class="text-[11px] font-bold uppercase tracking-widest text-sky-400">
        ABSENSI GURU
      </p>
      <h1 id="login-school-name" class="text-lg sm:text-xl font-extrabold tracking-wide text-white mt-0.5">
        MTs. MIFTAHUL ULUM
      </h1>
      <p class="text-xs text-slate-400 mt-1">Silakan masuk menggunakan akun terdaftar Anda</p>
    </div>

    <!-- Form Login & Pemilih Peran -->
    <div class="p-6 sm:p-7 space-y-5">

      <!-- Tab Pemilih Peran: Akun Guru vs Administrator -->
      <div class="grid grid-cols-2 gap-1.5 p-1.5 rounded-2xl bg-slate-100 border border-slate-200">
        <button type="button" id="tab-guru"
          class="py-2.5 px-3 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <span>Akun Guru</span>
        </button>

        <button type="button" id="tab-admin"
          class="py-2.5 px-3 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
          <span>Administrator</span>
        </button>
      </div>

      <!-- Alert Pesan Error / Info -->
      <div id="login-alert" class="hidden px-4 py-3 rounded-xl text-xs font-semibold border"></div>

      <form id="form-login" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Alamat Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="nama@gmail.com"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Kata Sandi</label>
          <div class="relative">
            <input type="password" id="password" required autocomplete="current-password" placeholder="Masukkan kata sandi"
              class="w-full px-4 py-3 pr-11 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
            <button type="button" id="toggle-password" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-700">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-submit-login"
          class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-[0.99] text-white text-xs sm:text-sm font-bold shadow-lg shadow-blue-600/25 transition disabled:opacity-60">
          Masuk sebagai Guru
        </button>
      </form>

      <p class="text-center text-[11px] text-slate-400 pt-1">
        Belum memiliki akun guru? Hubungi Administrator sekolah.
      </p>
    </div>

  </div>

  <script type="module">
    import { supabase } from './js/supabase.js';

    let peranDipilih = 'guru'; // Default tab aktif: 'guru' atau 'admin'

    const tabGuru = document.getElementById('tab-guru');
    const tabAdmin = document.getElementById('tab-admin');
    const btnSubmit = document.getElementById('btn-submit-login');
    const loginAlert = document.getElementById('login-alert');

    function tampilkanAlert(teks, tipe = 'error') {
      loginAlert.textContent = teks;
      loginAlert.classList.remove('hidden', 'bg-rose-50', 'border-rose-200', 'text-rose-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
      if (tipe === 'sukses') {
        loginAlert.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-800');
      } else {
        loginAlert.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
      }
    }

    function sembunyikanAlert() {
      loginAlert.classList.add('hidden');
    }

    // ================= 1. MUAT IDENTITAS & LOGO SEKOLAH =================
    async function muatIdentitasSekolah() {
      const { data } = await supabase
        .from('pengaturan_sekolah')
        .select('nama_aplikasi, nama_sekolah, logo_url')
        .eq('id', 1)
        .single();

      if (data) {
        document.getElementById('login-app-title').textContent = data.nama_aplikasi || 'ABSENSI GURU';
        document.getElementById('login-school-name').textContent = data.nama_sekolah || 'MTs. MIFTAHUL ULUM';

        if (data.logo_url) {
          const imgLogo = document.getElementById('login-logo');
          imgLogo.src = data.logo_url;
          imgLogo.classList.remove('hidden');
          document.getElementById('login-default-logo').classList.add('hidden');
        }
      }
    }
    muatIdentitasSekolah();

    // ================= 2. CEK JIKA SUDAH LOGIN SEBELUMNYA =================
    async function cekSesiAktif() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const { data: profil } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (profil?.role === 'admin') {
        window.location.replace('dashboard-admin.html');
      } else if (profil?.role === 'guru') {
        window.location.replace('dashboard-guru.html');
      }
    }
    cekSesiAktif();

    // ================= 3. PENGATURAN TAB GURU & ADMINISTRATOR =================
    const kelasTabAktif = 'py-2.5 px-3 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm transition flex items-center justify-center gap-1.5';
    const kelasTabNonAktif = 'py-2.5 px-3 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5';

    tabGuru.addEventListener('click', () => {
      peranDipilih = 'guru';
      tabGuru.className = kelasTabAktif;
      tabAdmin.className = kelasTabNonAktif;
      btnSubmit.textContent = 'Masuk sebagai Guru';
      sembunyikanAlert();
    });

    tabAdmin.addEventListener('click', () => {
      peranDipilih = 'admin';
      tabAdmin.className = kelasTabAktif;
      tabGuru.className = kelasTabNonAktif;
      btnSubmit.textContent = 'Masuk sebagai Administrator';
      sembunyikanAlert();
    });

    // Tampilkan / Sembunyikan Kata Sandi
    document.getElementById('toggle-password').addEventListener('click', () => {
      const inpPass = document.getElementById('password');
      inpPass.type = inpPass.type === 'password' ? 'text' : 'password';
    });

    // ================= 4. PROSES LOGIN & PENGALIHAN HALAMAN =================
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      sembunyikanAlert();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Memeriksa akun...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;

        // Ambil peran (role) pengguna dari tabel profiles
        const { data: profil, error: profilError } = await supabase
          .from('profiles')
          .select('role, nama_lengkap')
          .eq('id', data.user.id)
          .single();

        if (profilError || !profil) {
          await supabase.auth.signOut();
          throw new Error('Data profil akun tidak ditemukan di sistem.');
        }

        // Validasi kesesuaian tab login dengan role akun
        if (peranDipilih === 'admin' && profil.role !== 'admin') {
          await supabase.auth.signOut();
          throw new Error('Akun ini bukan akun Administrator. Silakan pilih tab "Akun Guru".');
        }

        if (peranDipilih === 'guru' && profil.role !== 'guru') {
          await supabase.auth.signOut();
          throw new Error('Akun ini terdaftar sebagai Administrator. Silakan pilih tab "Administrator".');
        }

        tampilkanAlert(`Selamat datang, ${profil.nama_lengkap}! Mengalihkan ke dashboard...`, 'sukses');

        // Pengalihan halaman sesuai peran (Admin vs Guru)
        if (profil.role === 'admin') {
          window.location.replace('dashboard-admin.html');
        } else {
          window.location.replace('dashboard-guru.html');
        }
      } catch (err) {
        let pesan = err.message;
        if (pesan.includes('Invalid login credentials')) {
          pesan = 'Email atau kata sandi salah. Silakan periksa kembali.';
        } else if (pesan.includes('Email not confirmed')) {
          pesan = 'Email akun belum dikonfirmasi di pengaturan Supabase.';
        }
        tampilkanAlert(pesan, 'error');
        btnSubmit.disabled = false;
        btnSubmit.textContent = peranDipilih === 'admin' ? 'Masuk sebagai Administrator' : 'Masuk sebagai Guru';
      }
    });
  </script>
</body>
</html>
